[package]
name = "sealr-validation"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
sealr = { git = "https://github.com/blisspixel/sealr", rev = "8090a6bb6b0a6cc51461d2bce18966eb1a323434", version = "=0.1.0-alpha.15" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.175"

[[bin]]
name = "sealr-validation"
path = "handoff/main.rs"

[[bin]]
name = "retention-experiment"
path = "experiments/retention/main.rs"

[[bin]]
name = "publisher-content-gate"
path = "publisher/main.rs"

[[bin]]
name = "repeated-read-probe"
path = "experiments/repeated-reads/main.rs"
